name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout with submodules
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      # ------------------------------------------------------------------ #
      # 2. Install OpenSSL via vcpkg
      #    build_picoquic_windows.ps1 already searches vcpkg at
      #    $env:VCPKG_INSTALLATION_ROOT with triplet x64-windows-static-md
      # ------------------------------------------------------------------ #
      - name: Install OpenSSL (vcpkg x64-windows-static-md)
        shell: pwsh
        run: ls && vcpkg install openssl:x64-windows-static-md

      # ------------------------------------------------------------------ #
      # 3. Install Rust + MSVC target
      # ------------------------------------------------------------------ #
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      # ------------------------------------------------------------------ #
      # 4. Build picoquic via the existing PowerShell script.
      #    It writes PICOQUIC_INCLUDE_DIR, PICOQUIC_LIB_DIR,
      #    PICOTLS_INCLUDE_DIR, and all OPENSSL_* vars into $GITHUB_ENV
      #    automatically, so cargo build picks them up in the next step.
      # ------------------------------------------------------------------ #
      - name: Build picoquic (via existing script)
        shell: pwsh
        run: pwsh -File scripts/build_picoquic_windows.ps1

      # ------------------------------------------------------------------ #
      # 5. Cargo build — all env vars already exported by the script above
      # ------------------------------------------------------------------ #
      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ------------------------------------------------------------------ #
      # 6. Upload .exe artifacts
      # ------------------------------------------------------------------ #
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target/x86_64-pc-windows-msvc/release/*.exe | Copy-Item -Destination dist/
          Get-ChildItem dist/

      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist/*.exe
          retention-days: 30
