name: Auto Release (Slipstream Windows)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout (IMPORTANT FIX)
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Setup workspace
      # -------------------------
      - name: Prepare folders
        run: |
          mkdir -p dist/amd64 dist/arm64 out

      # -------------------------
      # Download upstream binaries
      # -------------------------
      - name: Download Windows builds
        run: |
          curl -L "https://github.com/Mygod/slipstream-rust/releases/download/v0.1.1/slipstream-windows-x86_64.zip" \
            -o dist/amd64.zip

          curl -L "https://github.com/Mygod/slipstream-rust/releases/download/v0.1.1/slipstream-windows-arm64.zip" \
            -o dist/arm64.zip

      # -------------------------
      # Unzip
      # -------------------------
      - name: Unzip binaries
        run: |
          unzip -q dist/amd64.zip -d dist/amd64
          unzip -q dist/arm64.zip -d dist/arm64

      # -------------------------
      # Generate SHA256 checksums
      # -------------------------
      - name: Generate SHA256SUMS
        run: |
          cd dist

          find amd64 arm64 -type f -exec sha256sum {} \; > SHA256SUMS

          mv SHA256SUMS ../out/SHA256SUMS

      # -------------------------
      # Package release output
      # -------------------------
      - name: Prepare release files
        run: |
          cp -r dist/amd64 out/
          cp -r dist/arm64 out/

      # -------------------------
      # Generate timestamp tag
      # -------------------------
      - name: Create tag
        id: tag
        run: |
          TAG=$(date -u +"%Y%m%d-%H%M%S")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # -------------------------
      # Create Git tag (safe now)
      # -------------------------
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      # -------------------------
      # Create GitHub Release
      # -------------------------
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: slipstream ${{ steps.tag.outputs.tag }}
          files: out/**
          generate_release_notes: true
