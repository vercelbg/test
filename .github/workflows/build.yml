name: Build Slipstream Rust Core for Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Host build tools ────────────────────────────────────────────────
      - name: Install Native Compilation Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build perl pkg-config make python3

      # ── 3. Rust + Android target ───────────────────────────────────────────
      - name: Set up Rust & Android Target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      # ── 4. Android NDK r27d ────────────────────────────────────────────────
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # ── 5. Clone repo with submodules ──────────────────────────────────────
      - name: Clone slipstream-rust
        run: git clone --recursive https://github.com/Mygod/slipstream-rust

      # ── 6. Pre-build OpenSSL for aarch64-linux-android ────────────────────
      - name: Build OpenSSL 3.x for Android aarch64
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=34
          OPENSSL_VERSION=3.3.2
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/openssl-android"

          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            | tar xz
          cd "openssl-${OPENSSL_VERSION}"

          export PATH="${TOOLCHAIN}/bin:${PATH}"
          export ANDROID_NDK_ROOT

          ./Configure android-arm64 \
            -D__ANDROID_API__=${ANDROID_API} \
            --prefix="${OPENSSL_PREFIX}" \
            --openssldir="${OPENSSL_PREFIX}/ssl" \
            no-shared \
            no-tests \
            no-ui-console

          make -j"$(nproc)"
          make install_sw
          cd ..

          # Normalise lib64/ -> lib/ so all consumers use one path
          if [ -f "${OPENSSL_PREFIX}/lib64/libcrypto.a" ]; then
            echo "OpenSSL installed to lib64/, symlinking to lib/"
            ln -s "${OPENSSL_PREFIX}/lib64" "${OPENSSL_PREFIX}/lib"
          fi

          # Hard stop if the files still aren't where we expect them
          if [ ! -f "${OPENSSL_PREFIX}/lib/libcrypto.a" ]; then
            echo "ERROR: libcrypto.a not found after install" >&2
            find "${OPENSSL_PREFIX}" -name "*.a" || true
            exit 1
          fi
          if [ ! -f "${OPENSSL_PREFIX}/lib/libssl.a" ]; then
            echo "ERROR: libssl.a not found after install" >&2
            exit 1
          fi
          echo "OpenSSL pre-build OK: ${OPENSSL_PREFIX}/lib/"

      # ── 7. Write Cargo cross-compile config ───────────────────────────────
      #
      # All path values are expanded by the shell into the heredoc before
      # writing the file, so config.toml contains only literal strings.
      # This avoids any bash export / variable-expansion issues at build time.
      #
      - name: Write Cargo cross-compile config
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=34

          # Build each path as a plain shell variable first (no export needed)
          CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
          AR_BIN="${TOOLCHAIN}/bin/llvm-ar"
          RANLIB_BIN="${TOOLCHAIN}/bin/llvm-ranlib"
          STRIP_BIN="${TOOLCHAIN}/bin/llvm-strip"

          mkdir -p slipstream-rust/.cargo
          # Use a quoted heredoc (<<'EOF' would prevent expansion, so use <<EOF
          # with variables already resolved above)
          cat > slipstream-rust/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${CC}"
          ar     = "${AR_BIN}"

          [env]
          CC     = "${CC}"
          CXX    = "${CXX}"
          AR     = "${AR_BIN}"
          RANLIB = "${RANLIB_BIN}"
          STRIP  = "${STRIP_BIN}"
          EOF

          echo "Cargo config written:"
          cat slipstream-rust/.cargo/config.toml

      # ── 8. Build Rust workspace ────────────────────────────────────────────
      - name: Compile Android ARM64 Binaries
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd slipstream-rust

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=34
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/openssl-android"

          # Resolve all paths into plain variables FIRST, then export.
          # Never use `export VAR=path/with/slashes` with line continuations —
          # bash can misparse the continuation as part of the identifier.
          CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
          AR_BIN="${TOOLCHAIN}/bin/llvm-ar"
          RANLIB_BIN="${TOOLCHAIN}/bin/llvm-ranlib"
          LINKER="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          CARGO_LINKER_VAR="CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"

          export CC CXX
          export AR="${AR_BIN}"
          export RANLIB="${RANLIB_BIN}"

          # Cargo linker override — assign to a named var, then export by name
          export "${CARGO_LINKER_VAR}=${LINKER}"

          # openssl-sys: use our pre-built tree, static linking, no vendored build
          export OPENSSL_DIR="${OPENSSL_PREFIX}"
          export OPENSSL_STATIC=1
          export OPENSSL_INCLUDE_DIR="${OPENSSL_PREFIX}/include"
          export OPENSSL_LIB_DIR="${OPENSSL_PREFIX}/lib"

          # CMake / build_picoquic.sh: explicit paths so FindOpenSSL never
          # falls back to the Ubuntu host system OpenSSL
          export OPENSSL_ROOT_DIR="${OPENSSL_PREFIX}"
          export OPENSSL_USE_STATIC_LIBS=TRUE

          OPENSSL_CRYPTO_PATH="${OPENSSL_PREFIX}/lib/libcrypto.a"
          OPENSSL_SSL_PATH="${OPENSSL_PREFIX}/lib/libssl.a"
          export OPENSSL_CRYPTO_LIBRARY="${OPENSSL_CRYPTO_PATH}"
          export OPENSSL_SSL_LIBRARY="${OPENSSL_SSL_PATH}"

          # CMake cross-compile identity
          export CMAKE_GENERATOR=Ninja
          export CMAKE_SYSTEM_NAME=Android
          export CMAKE_SYSTEM_PROCESSOR=aarch64
          export CMAKE_ANDROID_NDK="${ANDROID_NDK_ROOT}"
          export CMAKE_ANDROID_API="${ANDROID_API}"

          CMAKE_C="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          CMAKE_CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
          CMAKE_AR_BIN="${TOOLCHAIN}/bin/llvm-ar"
          CMAKE_RANLIB_BIN="${TOOLCHAIN}/bin/llvm-ranlib"
          export CMAKE_C_COMPILER="${CMAKE_C}"
          export CMAKE_CXX_COMPILER="${CMAKE_CXX}"
          export CMAKE_AR="${CMAKE_AR_BIN}"
          export CMAKE_RANLIB="${CMAKE_RANLIB_BIN}"

          mkdir -p dist
          cargo build --release \
            --target aarch64-linux-android \
            -p slipstream-client \
            -p slipstream-server

          cp target/aarch64-linux-android/release/slipstream-client \
             dist/slipstream-client-android-arm64

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-android-client
          path: slipstream-rust/dist/slipstream-client-android-arm64
