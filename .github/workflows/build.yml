name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout with submodules
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      # ------------------------------------------------------------------ #
      # 2. Set up Visual Studio 2022 + MSVC
      # ------------------------------------------------------------------ #
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------------ #
      # 3. Install Rust + MSVC target
      # ------------------------------------------------------------------ #
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}\registry\index
            ${{ env.CARGO_HOME }}\registry\cache
            ${{ env.CARGO_HOME }}\git\db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}-v1
          restore-keys: picoquic-

      # ------------------------------------------------------------------ #
      # 4. Install Dependencies, Patch and Build picoquic
      # ------------------------------------------------------------------ #
      - name: Install PkgConfig on Windows
        run: |
          choco install pkgconf -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Patch Script to use Ninja Generator
        shell: pwsh
        run: |
          Write-Host "Modifying build script to bypass Visual Studio compiler block..."
          $scriptPath = "scripts/build_picoquic_windows.ps1"
          $content = Get-Content $scriptPath -Raw
          
          # Replace VS generator with Ninja and comment out the unsupported -A flag
          $content = $content -replace '"-G", "Visual Studio 17 2022"', '"-G", "Ninja"'
          $content = $content -replace '"-A", \$Platform', '# "-A", $Platform'
          
          # Inject CMake verbose output safely as a valid standalone array item
          $content = $content -replace '"-DCMAKE_POLICY_VERSION_MINIMUM=3.5"', '"-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DVERBOSE=ON"'
          
          Set-Content $scriptPath $content
          Write-Host "Patch applied successfully."

      - name: Build picoquic
        shell: pwsh
        run: |
          Write-Host "Starting picoquic generation script..."
          pwsh -File scripts/build_picoquic_windows.ps1

      # ------------------------------------------------------------------ #
      # 5. Cargo build (with verbose flag)
      # ------------------------------------------------------------------ #
      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose

      # ------------------------------------------------------------------ #
      # 6. Upload .exe artifacts
      # ------------------------------------------------------------------ #
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.exe | Copy-Item -Destination dist\
          Get-ChildItem dist\

      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 7

      # ------------------------------------------------------------------ #
      # 7. Troubleshooting / Debug Logs (Only runs if something fails)
      # ------------------------------------------------------------------ #
      - name: Diagnostics & Troubleshooting Logs
        if: failure()
        shell: pwsh
        run: |
          Write-Host "================== DETECTED BUILD FAILURE =================="
          Write-Host "Dumping internal CMake environment logs for troubleshooting..."
          
          $cmakeDir = Get-ChildItem -Path . -Filter "CMakeSystem.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          
          if ($cmakeDir) {
              $outputLog = Join-Path $cmakeDir "CMakeOutput.log"
              $errorLog = Join-Path $cmakeDir "CMakeError.log"
              
              if (Test-Path $outputLog) {
                  Write-Host "--- [START] CMakeOutput.log ---"
                  Get-Content $outputLog -Tail 100
                  Write-Host "--- [END] CMakeOutput.log ---"
              }
              if (Test-Path $errorLog) {
                  Write-Host "--- [START] CMakeError.log ---"
                  Get-Content $errorLog -Tail 150
                  Write-Host "--- [END] CMakeError.log ---"
              }
          } else {
              Write-Host "No explicit CMake logs found. The crash happened prior to CMake initialization."
          }
