name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}\registry\index
            ${{ env.CARGO_HOME }}\registry\cache
            ${{ env.CARGO_HOME }}\git\db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}-v1
          restore-keys: picoquic-

      # Detect the actual installed VS version and patch the script's
      # hardcoded "Visual Studio 17 2022" to match what's on the runner.
      - name: Patch and run picoquic build script
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInfo = & "$vsWhere" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -format json | ConvertFrom-Json | Select-Object -First 1

          if (!$vsInfo) { throw "vswhere could not find any Visual Studio installation" }

          $majorVersion = [int]($vsInfo.installationVersion.Split('.')[0])
          $yearMap = @{ 15 = "2017"; 16 = "2019"; 17 = "2022"; 18 = "2022" }
          # VS 18 ships as "Visual Studio 17 2022" in CMake generator names
          # because CMake hasn't added a VS 18 generator yet — but we still
          # need to point it at the right install path explicitly.
          $generatorVersion = if ($majorVersion -ge 18) { 17 } else { $majorVersion }
          $generatorYear    = if ($majorVersion -ge 18) { "2022" } else { $yearMap[$majorVersion] }
          $generator = "Visual Studio $generatorVersion $generatorYear"

          Write-Host "Detected VS $($vsInfo.installationVersion) → using CMake generator: $generator"
          Write-Host "VS install path: $($vsInfo.installationPath)"

          # Patch the hardcoded generator string in the script
          $scriptPath = "scripts/build_picoquic_windows.ps1"
          $content = Get-Content $scriptPath -Raw
          $content = $content -replace '"Visual Studio \d+ \d+"', "`"$generator`""

          # Also inject -DCMAKE_GENERATOR_INSTANCE so CMake finds this exact VS
          $instanceArg = '"-DCMAKE_GENERATOR_INSTANCE=' + $vsInfo.installationPath.Replace('\','/') + '",'
          $content = $content -replace '("-G", "Visual Studio[^"]+",)', "`$1`n        $instanceArg"

          $patchedScript = "scripts/build_picoquic_windows_patched.ps1"
          $content | Set-Content $patchedScript -Encoding utf8

          pwsh -File $patchedScript

      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.exe | Copy-Item -Destination dist\
          Get-ChildItem dist\

      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 30
