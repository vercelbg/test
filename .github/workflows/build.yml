name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}\registry\index
            ${{ env.CARGO_HOME }}\registry\cache
            ${{ env.CARGO_HOME }}\git\db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}-v1
          restore-keys: picoquic-

      # The build script hardcodes "Visual Studio 17 2022" but the runner has
      # VS 18. CMake has no VS 18 generator yet so we still use "17 2022",
      # but must pass version=18.x in CMAKE_GENERATOR_INSTANCE (not a path).
      - name: Patch and run picoquic build script
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInfo = & "$vsWhere" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -format json | ConvertFrom-Json | Select-Object -First 1

          if (!$vsInfo) { throw "vswhere could not find any Visual Studio installation" }

          $vsVersion = $vsInfo.installationVersion   # e.g. "18.6.11822.322"
          $vsPath    = $vsInfo.installationPath       # e.g. "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          Write-Host "Found VS $vsVersion at $vsPath"

          # CMake expects CMAKE_GENERATOR_INSTANCE as "path,version=X.Y.Z"
          # when the instance isn't registered the normal way (VS 18 case).
          $instanceValue = "$vsPath,version=$vsVersion"

          $scriptPath = "scripts/build_picoquic_windows.ps1"
          $content = Get-Content $scriptPath -Raw

          # Inject -DCMAKE_GENERATOR_INSTANCE right after the -G argument
          $instanceArg = '"-DCMAKE_GENERATOR_INSTANCE=' + $instanceValue.Replace('\', '/') + '",'
          $content = $content -replace '("-G",\s*"Visual Studio[^"]+",)', "`$1`n        $instanceArg"

          $patchedScript = "scripts/build_picoquic_windows_patched.ps1"
          $content | Set-Content $patchedScript -Encoding utf8

          pwsh -File $patchedScript

      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.exe | Copy-Item -Destination dist\
          Get-ChildItem dist\

      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 30
