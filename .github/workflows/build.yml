name: Build Windows
on:
  push:
    branches: [main, master]
env:
  CARGO_TERM_COLOR: always
jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout with submodules
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive
      # ------------------------------------------------------------------ #
      # 2. Install Rust + MSVC target
      # ------------------------------------------------------------------ #
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}\registry\index
            ${{ env.CARGO_HOME }}\registry\cache
            ${{ env.CARGO_HOME }}\git\db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}-v1
          restore-keys: picoquic-
      # ------------------------------------------------------------------ #
      # 2.5. Ensure Visual Studio Build Tools + CMake are present
      # windows-latest ships VS 2022 but let's make vswhere can find it
      # ------------------------------------------------------------------ #
      - name: Install Visual Studio Build Tools components
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if ($vsPath) {
            Write-Host "Visual Studio found at: $vsPath"
          } else {
            Write-Host "VS not found via vswhere, installing Build Tools..."
            $url = "https://aka.ms/vs/17/release/vs_buildtools.exe"
            $installer = "$env:TEMP\vs_buildtools.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            & $installer --quiet --wait --norestart `
              --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              --add Microsoft.VisualStudio.Component.Windows11SDK.22621
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "VS Build Tools installation failed: $LASTEXITCODE"
            }
          }
      # ------------------------------------------------------------------ #
      # 2.6. Setup MSVC Developer Command Prompt
      # ------------------------------------------------------------------ #
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      # ------------------------------------------------------------------ #
      # 2.7. Verify CMake and VS generator are functional
      # ------------------------------------------------------------------ #
      - name: Verify CMake + VS generator
        shell: pwsh
        run: |
          cmake --version
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      # ------------------------------------------------------------------ #
      # 3. Build picoquic via the existing PowerShell script
      # ------------------------------------------------------------------ #
      - name: Build picoquic
        shell: pwsh
        run: pwsh -File scripts/build_picoquic_windows.ps1
      # ------------------------------------------------------------------ #
      # 4. Cargo build — all env vars exported by the script above
      # ------------------------------------------------------------------ #
      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc
      # ------------------------------------------------------------------ #
      # 5. Upload .exe artifacts
      # ------------------------------------------------------------------ #
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.exe | Copy-Item -Destination dist\
          Get-ChildItem dist\
      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 30
