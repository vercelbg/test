name: Build Slipstream Rust Core for Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Host build tools ────────────────────────────────────────────────
      - name: Install Native Compilation Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build perl pkg-config make python3

      # ── 3. Rust + Android target ───────────────────────────────────────────
      - name: Set up Rust & Android Target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      # ── 4. Android NDK r27d ────────────────────────────────────────────────
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # ── 5. Clone repo with submodules ──────────────────────────────────────
      - name: Clone slipstream-rust
        run: git clone --recursive https://github.com/Mygod/slipstream-rust

      # ── 6. Phase 1: build ONLY openssl-sys so we can capture its output dir ──
      #
      # WHY a two-phase build:
      #   The intended design (per slipstream-plugin-android) is OPENSSL_VENDORED=1.
      #   openssl-sys builds OpenSSL into a path like:
      #     target/<triple>/release/build/openssl-sys-<hash>/out/
      #   build_picoquic.sh / the slipstream-ffi build.rs needs that path to
      #   pass -DOPENSSL_ROOT_DIR=... to CMake. But openssl-sys and slipstream-ffi
      #   are parallelised by Cargo — the picoquic CMake can run before OpenSSL
      #   finishes building, or before the path is known.
      #
      #   Solution: run `cargo build -p openssl-sys` alone first (no parallelism
      #   issue), find the output dir, then export OPENSSL_ROOT_DIR / related vars
      #   so slipstream-ffi's CMake invocation finds them already-built.
      #
      - name: Phase 1 — Build vendored OpenSSL via openssl-sys
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd slipstream-rust

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=34
          NDK_CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          NDK_CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
          NDK_AR="${TOOLCHAIN}/bin/llvm-ar"
          NDK_RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"

          # Export NDK toolchain for CC/CXX so openssl-sys's configure picks
          # up the right cross-compiler
          export CC="${NDK_CC}"
          export CXX="${NDK_CXX}"
          export AR="${NDK_AR}"
          export RANLIB="${NDK_RANLIB}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_CC}"

          # Tell openssl-sys to vendor (build from source) for Android
          export OPENSSL_VENDORED=1

          # Build only the openssl-sys build script — this compiles OpenSSL
          # into target/aarch64-linux-android/release/build/openssl-sys-*/out/
          # but does NOT yet build any crate that calls into it.
          cargo build \
            --target aarch64-linux-android \
            --release \
            -p openssl-sys

          # ── Locate the vendored output dir ───────────────────────────────
          # openssl-sys emits a `DEP_OPENSSL_ROOT` env var captured in its
          # build output metadata. The most reliable way to find the actual
          # on-disk path is to look for libssl.a under the build output dir.
          OPENSSL_OUT=$(find target/aarch64-linux-android/release/build \
            -name "libssl.a" -path "*/openssl-sys-*/out/*" \
            | head -n1 | xargs dirname)

          if [ -z "${OPENSSL_OUT}" ]; then
            echo "ERROR: Could not locate vendored libssl.a" >&2
            find target/aarch64-linux-android/release/build -name "libssl.a" || true
            exit 1
          fi

          OPENSSL_INCLUDE=$(find target/aarch64-linux-android/release/build \
            -name "opensslconf.h" -path "*/openssl-sys-*/out/*" \
            | head -n1 | xargs dirname | xargs dirname)

          echo "Vendored OpenSSL lib dir:     ${OPENSSL_OUT}"
          echo "Vendored OpenSSL include dir: ${OPENSSL_INCLUDE}"

          # ── Persist paths for Phase 2 via GITHUB_ENV ─────────────────────
          # Variables written here are available in all subsequent steps.
          echo "OPENSSL_LIB_OUT=${OPENSSL_OUT}"         >> "${GITHUB_ENV}"
          echo "OPENSSL_INC_OUT=${OPENSSL_INCLUDE}"     >> "${GITHUB_ENV}"

      # ── 7. Phase 2: full build with CMake pointed at the vendored OpenSSL ──
      #
      # Now that OpenSSL is built and its path is known, we set every variable
      # that FindOpenSSL.cmake and build_picoquic.sh consult, so CMake never
      # falls back to searching the Ubuntu host system.
      #
      # KEY LESSON from the previous error:
      #   Do NOT set CMAKE_SYSTEM_NAME, CMAKE_C_COMPILER, etc. as plain env vars
      #   when the NDK toolchain file is also being loaded — they conflict.
      #   Instead, write a CMake initial-cache file (-C flag) and pass it via
      #   PICOQUIC_CMAKE_EXTRA_ARGS (or the equivalent var the build.rs reads).
      #   For variables that are purely about OpenSSL discovery, env vars are fine
      #   because FindOpenSSL.cmake reads them directly before the toolchain acts.
      #
      - name: Phase 2 — Full Rust workspace build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd slipstream-rust

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=34
          NDK_CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          NDK_CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
          NDK_AR="${TOOLCHAIN}/bin/llvm-ar"
          NDK_RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"

          # Paths captured from Phase 1
          OPENSSL_LIB="${OPENSSL_LIB_OUT}"
          OPENSSL_INC="${OPENSSL_INC_OUT}"
          OPENSSL_ROOT=$(dirname "${OPENSSL_LIB}")   # out/ parent

          # ── NDK toolchain ────────────────────────────────────────────────
          export CC="${NDK_CC}"
          export CXX="${NDK_CXX}"
          export AR="${NDK_AR}"
          export RANLIB="${NDK_RANLIB}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_CC}"

          # ── openssl-sys: re-use Phase 1 output, no second build ──────────
          export OPENSSL_VENDORED=1
          export OPENSSL_STATIC=1
          export OPENSSL_LIB_DIR="${OPENSSL_LIB}"
          export OPENSSL_INCLUDE_DIR="${OPENSSL_INC}"

          # ── Write a CMake initial-cache file ─────────────────────────────
          # An initial-cache file is processed before any CMakeLists.txt and
          # before the toolchain file, so these values win regardless of what
          # FindOpenSSL or picotls try to do. This avoids the "Cannot set
          # PICOQUIC_* because current scope has no parent" clash that comes
          # from mixing toolchain-file variables with plain env var injection.
          CMAKE_CACHE_FILE="${PWD}/openssl-android-cache.cmake"
          cat > "${CMAKE_CACHE_FILE}" << CACHE
          set(OPENSSL_ROOT_DIR      "${OPENSSL_ROOT}"                    CACHE PATH   "" FORCE)
          set(OPENSSL_INCLUDE_DIR   "${OPENSSL_INC}"                     CACHE PATH   "" FORCE)
          set(OPENSSL_CRYPTO_LIBRARY "${OPENSSL_LIB}/libcrypto.a"        CACHE FILEPATH "" FORCE)
          set(OPENSSL_SSL_LIBRARY    "${OPENSSL_LIB}/libssl.a"           CACHE FILEPATH "" FORCE)
          set(OPENSSL_USE_STATIC_LIBS TRUE                               CACHE BOOL   "" FORCE)
          set(CMAKE_SYSTEM_NAME     "Android"                            CACHE STRING "" FORCE)
          set(CMAKE_SYSTEM_VERSION  "${ANDROID_API}"                     CACHE STRING "" FORCE)
          set(CMAKE_ANDROID_NDK     "${ANDROID_NDK_ROOT}"                CACHE PATH   "" FORCE)
          set(CMAKE_C_COMPILER      "${NDK_CC}"                          CACHE FILEPATH "" FORCE)
          set(CMAKE_CXX_COMPILER    "${NDK_CXX}"                         CACHE FILEPATH "" FORCE)
          set(CMAKE_AR              "${NDK_AR}"                          CACHE FILEPATH "" FORCE)
          set(CMAKE_RANLIB          "${NDK_RANLIB}"                      CACHE FILEPATH "" FORCE)
          CACHE

          echo "CMake initial-cache file:"
          cat "${CMAKE_CACHE_FILE}"

          # ── Pass the cache file to build_picoquic.sh / build.rs ──────────
          # build_picoquic.sh forwards extra cmake args via $PICOQUIC_CMAKE_ARGS.
          # The build.rs in slipstream-ffi reads this variable when it calls cmake.
          export PICOQUIC_CMAKE_ARGS="-C ${CMAKE_CACHE_FILE}"
          export CMAKE_GENERATOR=Ninja

          # ── Full build ────────────────────────────────────────────────────
          mkdir -p dist
          cargo build --release \
            --target aarch64-linux-android \
            -p slipstream-client \
            -p slipstream-server

          cp target/aarch64-linux-android/release/slipstream-client \
             dist/slipstream-client-android-arm64

      # ── 8. Upload artifact ─────────────────────────────────────────────────
      - name: Upload Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-android-client
          path: slipstream-rust/dist/slipstream-client-android-arm64
