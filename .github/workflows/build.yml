name: Build Slipstream Rust Core for Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch code + include the crucial picoquic submodule
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Setup Build System Utilities for picoquic C dependencies
      - name: Install Native Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl pkg-config

      # 3. Setup Rust and add the Android 64-bit target
      - name: Set up Rust & Android Target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      # 4. Setup Android NDK
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # 5. Compile the Rust workspace for Android
      - name: Compile Android ARM64 Binaries
        run: |
          # Clone upstream and jump in
          git clone --recursive https://github.com/Mygod/slipstream-rust
          cd slipstream-rust
          
          mkdir -p dist
          
          # Dynamic toolchain mappings tailored to NDK r27d matching API 34+ guidelines
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android34-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android34-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          
          # Pass the linker configurations explicitly to Cargo
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC
          
          # Explicit target environments for inner CMake builds (picoquic)
          export CMAKE_GENERATOR=Ninja

          # --- FORCE OPENSSL VENDORED COMPILATION ---
          export OPENSSL_STATIC=1
          export OPENSSL_VENDORED=1
          export PKG_CONFIG_ALLOW_CROSS=1

          # --- DYNAMIC SYSTEM PATCH FOR INNER CMAKE (PICOQUIC) ---
          # We trigger a partial build just for openssl-sys first. This forces Cargo to compile
          # OpenSSL and create the directory before CMake starts tracking its assets.
          cargo build --release --target aarch64-linux-android -p openssl-sys

          # Now use folder wildcards to locate the randomized build hash directory
          VENDORED_OUT_DIR=$(ls -d $(pwd)/target/aarch64-linux-android/release/build/openssl-sys-*/out/openssl-build/install 2>/dev/null | head -n 1)
          
          # Inject the dynamically found folder into CMake environments
          if [ -d "$VENDORED_OUT_DIR" ]; then
            echo "Found OpenSSL Target Build Directory: $VENDORED_OUT_DIR"
            export OPENSSL_ROOT_DIR="$VENDORED_OUT_DIR"
            export OPENSSL_INCLUDE_DIR="$VENDORED_OUT_DIR/include"
            export OPENSSL_CRYPTO_LIBRARY="$VENDORED_OUT_DIR/lib/libcrypto.a"
            export OPENSSL_SSL_LIBRARY="$VENDORED_OUT_DIR/lib/libssl.a"
          else
            echo "Warning: Vendored OpenSSL directory not matched via wildcard scanning!"
          fi
          
          # Build both the slipstream-client and slipstream-server packages in release mode
          cargo build --release \
            --target aarch64-linux-android \
            -p slipstream-client \
            -p slipstream-server \
            --features openssl/vendored
          
          # Move the compiled client binary to our distribution folder
          cp target/aarch64-linux-android/release/slipstream-client dist/slipstream-client-android-arm64

      # 6. Export the finished file
      - name: Upload Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-android-client
          path: slipstream-rust/dist/slipstream-client-android-arm64
