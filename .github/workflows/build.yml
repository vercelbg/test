name: Build Slipstream Rust Core for Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch code + include the crucial picoquic submodule
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Setup Build System Utilities for picoquic C dependencies
      - name: Install Native Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl pkg-config

      # 3. Setup Rust and add the Android 64-bit target
      - name: Set up Rust & Android Target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      # 4. Setup Android NDK
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # 5. Compile the Rust workspace for Android
      - name: Compile Android ARM64 Binaries
        run: |
          # Clone upstream and jump in
          git clone --recursive https://github.com/Mygod/slipstream-rust
          cd slipstream-rust
          
          mkdir -p dist
          
          # --- WORKSPACE TOML INJECTION ---
          # Force the entire crate registry to look at our patched version of openssl-sys 
          # by adding a global patch block to the bottom of Cargo.toml
          echo -e "\n[patch.crates-io]\nopenssl-sys = { version = '0.9', features = ['vendored'] }" >> Cargo.toml
          
          # Setup Toolchain Environment Paths for NDK r27d
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android34-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android34-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          
          # Map compilation link arrays explicitly to Cargo
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC
          export CMAKE_GENERATOR=Ninja

          # Force static linking flags globally 
          export OPENSSL_STATIC=1
          export OPENSSL_VENDORED=1

          # Build both binaries inside the repository workspace cleanly
          cargo build --release \
            --target aarch64-linux-android \
            -p slipstream-client \
            -p slipstream-server
          
          # Move the compiled client binary to our distribution folder
          cp target/aarch64-linux-android/release/slipstream-client dist/slipstream-client-android-arm64

      # 6. Export the finished file
      - name: Upload Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-android-client
          path: slipstream-rust/dist/slipstream-client-android-arm64
