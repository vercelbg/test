name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}\registry\index
            ${{ env.CARGO_HOME }}\registry\cache
            ${{ env.CARGO_HOME }}\git\db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}-v1
          restore-keys: picoquic-

      - name: Patch and run picoquic build script
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInfo = & "$vsWhere" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -format json | ConvertFrom-Json | Select-Object -First 1

          if (!$vsInfo) { throw "vswhere could not find any Visual Studio installation" }

          $vsVersion  = $vsInfo.installationVersion  # e.g. "18.6.11822.322"
          $vsMajor    = [int]($vsVersion.Split('.')[0])  # 18
          $vsPath     = $vsInfo.installationPath
          Write-Host "Found VS $vsVersion (major=$vsMajor) at $vsPath"

          # Map major version to CMake generator name.
          # CMake 3.28+ supports "Visual Studio 18 2022" for VS 18.
          $yearMap = @{ 15 = "2017"; 16 = "2019"; 17 = "2022"; 18 = "2022" }
          $generatorName = "Visual Studio $vsMajor $($yearMap[$vsMajor])"
          $instanceValue = "$vsPath,version=$vsVersion"
          Write-Host "Using generator: $generatorName"
          Write-Host "Instance: $instanceValue"

          $content = Get-Content "scripts/build_picoquic_windows.ps1" -Raw

          # 1. Replace the hardcoded generator string with the detected one
          $content = $content -replace '"Visual Studio \d+ \d+"', "`"$generatorName`""

          # 2. Inject CMAKE_GENERATOR_INSTANCE right after the -G line
          $instanceArg = '"-DCMAKE_GENERATOR_INSTANCE=' + $instanceValue.Replace('\', '/') + '",'
          $content = $content -replace '("-G",\s*"[^"]+",)', "`$1`n        $instanceArg"

          $content | Set-Content "scripts/build_picoquic_windows_patched.ps1" -Encoding utf8
          pwsh -File "scripts/build_picoquic_windows_patched.ps1"

      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.exe | Copy-Item -Destination dist\
          Get-ChildItem dist\

      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 30
