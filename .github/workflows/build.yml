name: Build Windows

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          submodules: recursive

      # ------------------------------------------------------------
      # Install Rust
      # ------------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ------------------------------------------------------------
      # Install Ninja
      # ------------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      # ------------------------------------------------------------
      # Cache Cargo
      # ------------------------------------------------------------
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-

      # ------------------------------------------------------------
      # Cache picoquic
      # ------------------------------------------------------------
      - name: Cache picoquic build
        uses: actions/cache@v4
        with:
          path: .picoquic-build
          key: picoquic-${{ hashFiles('vendor/picoquic/**') }}
          restore-keys: picoquic-

      # ------------------------------------------------------------
      # 🔥 PATCH SCRIPT (THIS IS THE IMPORTANT PART)
      # ------------------------------------------------------------
      - name: Patch CMake generator to Ninja
        shell: pwsh
        run: |
          $file = "scripts/build_picoquic_windows.ps1"
          (Get-Content $file) `
            -replace '"Visual Studio 17 2022"', '"Ninja"' `
            | Set-Content $file

      # ------------------------------------------------------------
      # Build picoquic
      # ------------------------------------------------------------
      - name: Build picoquic
        shell: pwsh
        run: pwsh -File scripts/build_picoquic_windows.ps1

      # ------------------------------------------------------------
      # Build Rust project
      # ------------------------------------------------------------
      - name: Build slipstream (release)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ------------------------------------------------------------
      # Collect artifacts
      # ------------------------------------------------------------
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\x86_64-pc-windows-msvc\release\*.exe dist\
          Get-ChildItem dist

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload slipstream binaries
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: dist\*.exe
          retention-days: 30
