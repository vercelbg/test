name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: clone slipstream-rust
        run: git clone https://github.com/Mygod/slipstream-rust.git

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: build release
        shell: pwsh
        run: |
          cd slipstream-rust
          cargo build --release --workspace

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-x64
          path: slipstream-rust/target/release/*.exe
