name: Auto Release (Windows unpack + checksum)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Create workspace
        run: |
          mkdir -p dist/amd64 dist/arm64 out

      # -------------------------
      # Download assets
      # -------------------------
      - name: Download Windows binaries
        run: |
          curl -L "https://github.com/Mygod/slipstream-rust/releases/download/v0.1.1/slipstream-windows-x86_64.zip" \
            -o dist/amd64.zip

          curl -L "https://github.com/Mygod/slipstream-rust/releases/download/v0.1.1/slipstream-windows-arm64.zip" \
            -o dist/arm64.zip

      # -------------------------
      # Unzip
      # -------------------------
      - name: Unzip files
        run: |
          unzip dist/amd64.zip -d dist/amd64
          unzip dist/arm64.zip -d dist/arm64

      # -------------------------
      # Generate SHA256 checksums
      # -------------------------
      - name: Create SHA256SUMS
        run: |
          cd dist

          find . -type f ! -name "SHA256SUMS" -exec sha256sum {} \; > SHA256SUMS

          mv SHA256SUMS ../out/SHA256SUMS

      # -------------------------
      # Package final output
      # -------------------------
      - name: Prepare release files
        run: |
          cp -r dist/amd64 out/
          cp -r dist/arm64 out/

      # -------------------------
      # Timestamp tag
      # -------------------------
      - name: Generate tag
        id: tag
        run: |
          TAG=$(date -u +"%Y%m%d-%H%M%S")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # -------------------------
      # Create git tag
      # -------------------------
      - name: Push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      # -------------------------
      # Create release
      # -------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: slipstream ${{ steps.tag.outputs.tag }}
          files: out/**
          generate_release_notes: true
