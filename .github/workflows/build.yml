name: Package slipstream Windows releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest release metadata
        id: release
        run: |
          curl -s https://api.github.com/repos/Mygod/slipstream-rust/releases/latest > release.json

      - name: Extract URLs
        run: |
          AMD64=$(jq -r '.assets[] | select(.name | test("windows.*amd64")) | .browser_download_url' release.json)
          ARM64=$(jq -r '.assets[] | select(.name | test("windows.*arm64")) | .browser_download_url' release.json)
          CHECKSUM=$(jq -r '.assets[] | select(.name | test("sha256|SHA256|checksum")) | .browser_download_url' release.json)

          echo "AMD64=$AMD64" >> $GITHUB_ENV
          echo "ARM64=$ARM64" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      - name: Download files
        run: |
          mkdir dist
          curl -L "$AMD64" -o dist/windows-amd64.bin
          curl -L "$ARM64" -o dist/windows-arm64.bin
          if [ -n "$CHECKSUM" ]; then
            curl -L "$CHECKSUM" -o dist/SHA256SUMS
          fi

      - name: Verify checksum
        run: |
          if [ -f dist/SHA256SUMS ]; then
            cd dist
            sha256sum -c SHA256SUMS || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-windows-packages
          path: dist/
