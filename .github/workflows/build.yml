name: Multi-Platform Build & Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0
  workflow_dispatch: # Allows you to run this manually from the Actions tab

permissions:
  contents: write # Crucial permission allowing GitHub Actions to create the release

jobs:
  # ==============================================================================
  # JOB 1: STAGE 1 COMPILATION (PARALLEL RUNNERS)
  # ==============================================================================
  build-assets:
    name: Build Target Ecosystem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: dnstt-android
            script: ./build-dnstt-android.sh
          - name: dnstt-linux
            script: ./build-dnstt-linux.sh
          - name: dnstt-macos
            script: ./build-dnstt-macos.sh
          - name: dnstt-windows
            script: ./build-dnstt-windows.sh
          - name: slipstream-android
            script: ./build-slipstream-android.sh
          - name: slipstream-linux
            script: ./build-slipstream-linux.sh
          - name: slipstream-macos
            script: ./build-slipstream-macos.sh
          - name: slipstream-windows-prebuilt
            script: ./fetch-windows-slipstream.sh

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go Runtime Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Pins the Go version for all DNSTT builds

      - name: Set up Rust Toolchain (For Slipstream)
        if: contains(matrix.target.name, 'slipstream')
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk (For Slipstream Android Cross-Compilation)
        if: matrix.target.name == 'slipstream-android'
        run: cargo install cargo-ndk

      - name: Make Scripts Executable
        run: chmod +x ${{ matrix.target.script }}

      - name: Execute Stage 1 Script
        run: ${{ matrix.target.script }}

      # Upload raw compiled binaries from individual 'dist/' folders to workflow storage
      - name: Upload Temporary Raw Binaries
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries-${{ matrix.target.name }}
          path: dist/
          retention-days: 1

  # ==============================================================================
  # JOB 2: STAGE 2 MONOLITHIC RELEASE GENERATION
  # ==============================================================================
  publish-release:
    name: Package Assets & Publish Release
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Create an empty dist directory to download everything back into
      - name: Initialize Collection Directory
        run: mkdir -p dist

      # Download all multi-architecture raw artifacts down from workflow storage
      - name: Download All Staged Raw Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true # Flattens all binaries straight into the dist/ root

      - name: Make Release Script Executable
        run: chmod +x ./release.sh

      - name: Execute Stage 2 Release Aggregator
        run: ./release.sh

      # Automatically publish to GitHub Releases
      - name: Deploy Monolithic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          body_path: release/checksum.txt # Injects the checksum.txt directly into the release notes!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
